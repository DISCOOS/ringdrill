# The Flutter web build no longer deploys to Netlify at all — it ships to
# Cloudflare Pages (`ringdrill-pwa`) via the `pwa` job in
# .github/workflows/deploy-origins.yml. This site only receives the
# `functions` job's deploy (`netlify deploy --functions=netlify/functions`)
# and never a `--dir` containing a Flutter build, so nothing here is served
# statically; the redirects below exist to route requests the apex proxy
# Worker (workers/apex-proxy/) forwards to api.ringdrill.app.
#
# Auto-publishing from Git should be turned off in the Netlify dashboard
# (Site settings -> Build & deploy -> Continuous deployment -> Stop
# builds) so a stray push does not race the GH Actions deploy.

# Cache policy: keep index fresh, fingerprinted assets long-lived
[[headers]]
    for = "/index.html"
    [headers.values]
        Cache-Control = "no-cache"

[[headers]]
    for = "/*.drill"
    [headers.values]
        Content-Type = "application/vnd.ringdrill+zip"
        Content-Disposition = "attachment"

[[headers]]
    for = "/assets/*"
    [headers.values]
        Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
    for = "/canvaskit/*"
    [headers.values]
        Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
    for = "/main.dart.js"
    [headers.values]
        Cache-Control = "no-cache"

[[headers]]
    for = "/flutter_bootstrap.js"
    [headers.values]
        Cache-Control = "no-cache"

[[headers]]
    for = "/flutter.js"
    [headers.values]
        Cache-Control = "no-cache"

[[headers]]
    for = "/manifest.json"
    [headers.values]
        Cache-Control = "no-cache"

[[headers]]
    for = "/flutter_service_worker.js"
    [headers.values]
        Cache-Control = "no-cache"

[functions]
    directory = "netlify/functions"

# The cross-compiled source compiler (ADR-0060) ships as a data file rather than an
# import. dart2js output must not be re-bundled: esbuild inlines an imported module
# into the function, and that breaks Dart's runtime type information — analyze_plan
# failed with "type 'minified:z2' is not a subtype of type 'minified:z'" while
# simpler tools worked. lib/mcp-compiler.js therefore reads and evaluates it at
# runtime, which means esbuild never sees a dependency to follow, which means this
# is what puts the file in the deployed bundle.
#
# Scoped to the one function that needs it. Under the global [functions] table it
# applied to *every* function, and Netlify copied the 706 KB bundle into all sixteen
# deployment packages.
[functions."mcp"]
    # The cross-compiled compiler, plus the authoring guide the server exposes as
    # MCP resources (ADR-0065). Scoped to this function on purpose: under the global
    # [functions] table, included_files applies to every function, which copied the
    # 700 KB bundle into all sixteen deployment packages.
    included_files = [
        "netlify/functions/lib/mcp-compiler-bundle.js",
        "skills/ringdrill-plan-authoring/SKILL.md",
        "skills/ringdrill-plan-authoring/reference/format.md",
    ]

# Public API aliases.
#
# Two forms are supported. Both route to the same Netlify function.
#
# Function-name form (`/api/<function-name>`) is what DrillClient uses
# after the ADR-0039 Phase 2a refactor. Dash-separated because that is
# how the .js files are named under netlify/functions/ and the Netlify
# function name equals the file basename.
#
# REST-style slash-form (`/api/<noun>/<verb>`) is the canonical public
# API surface referenced by docs, ADRs, plans/, robots.txt and external
# consumers. Kept as a stable alias so those references never break
# even if the client's URL construction changes.
#
# The direct `/.netlify/functions/<name>` path always works too — it is
# served natively by Netlify and does not require an entry here. The
# old cached PWA on apex still uses it, and continues to.

# Organisations and members (ADR-0024, DESIGN-015 §6).
[[redirects]]
    from = "/api/accounts/*"
    to = "/.netlify/functions/accounts/:splat"
    status = 200
    force = true

[[redirects]]
    from = "/api/accounts"
    to = "/.netlify/functions/accounts"
    status = 200
    force = true

# Answering an invitation (DESIGN-015 §6.4). Separate from /api/accounts/*
# because the describe step must work signed out — the landing page has to
# say "sign in as ola@example.com" before anyone has signed in.
[[redirects]]
    from = "/api/invitations/*"
    to = "/.netlify/functions/invitations/:splat"
    status = 200
    force = true

# The auth surface (ADR-0024). One function, five routes — see
# netlify/functions/auth.js for why they are not five functions.
[[redirects]]
    from = "/api/auth/*"
    to = "/.netlify/functions/auth/:splat"
    status = 200
    force = true

[[redirects]]
    from = "/api/drills-upload"
    to = "/.netlify/functions/drills-upload"
    status = 200

[[redirects]]
    from = "/api/drills-policy"
    to = "/.netlify/functions/drills-policy"
    status = 200

# The hosted MCP endpoint (ADR-0060). `/mcp` is the conventional path a client
# expects, so it is exposed at the API origin's root rather than under /api/ —
# a URL a person pastes into a client config should be as short as it can be.
#
# No `[redirects.rate_limit]` block here, and none in the function's `config`
# export either. Both were tried and neither registers on this deploy path:
# Netlify reads code-based rate limit rules during a deploy's post-processing
# stage, and `netlify deploy --prod --dir=. --functions=...` never runs it. The
# config resolver parses both forms without complaint, the deploy log ends at
# "Deploy is live!" with no post-processing section, and production answered 100
# requests in under 4 seconds with no 429 — twice, once per form.
#
# The limit is enforced inside the function instead, per caller, on tool calls
# only. See netlify/functions/lib/mcp-rate-limit.js. That also covers
# `/.netlify/functions/mcp`, which Netlify serves whether or not a redirect names
# it and which no rule in this table could ever have reached.
[[redirects]]
    from = "/mcp"
    to = "/.netlify/functions/mcp"
    status = 200

[[redirects]]
    from = "/api/mcp"
    to = "/.netlify/functions/mcp"
    status = 200

# Downloads an archive `build_plan` just compiled (ADR-0070). A separate function from
# `/mcp` on purpose: this only moves bytes, so it must not load the 737 KB compiler
# bundle, and `/mcp` answers 405 to GET to say it is stateless and pushes nothing.
#
# Position does not matter against the two exact `/mcp` entries above — they cannot
# match a longer path — but it must stay above the SPA catch-all, which would otherwise
# serve the app shell for a download link.
[[redirects]]
    from = "/mcp/artifact/*"
    to = "/.netlify/functions/mcp-artifact/:splat"
    status = 200

[[redirects]]
    from = "/api/drills-head/*"
    to = "/.netlify/functions/drills-head/:splat"
    status = 200

[[redirects]]
    from = "/api/market-feed"
    to = "/.netlify/functions/market-feed"
    status = 200

[[redirects]]
    from = "/api/drills-admin"
    to = "/.netlify/functions/drills-admin"
    status = 200

[[redirects]]
    from = "/api/drills/upload"
    to = "/.netlify/functions/drills-upload"
    status = 200

[[redirects]]
    from = "/api/drills/head/*"
    to = "/.netlify/functions/drills-head/:splat"
    status = 200

# Per-plan access policy (ADR-0025). Its own endpoint rather than a
# parameter on upload, so an ordinary publish can never widen access as a
# side effect — and so the owner-only check has one place to live.
[[redirects]]
    from = "/api/drills/policy"
    to = "/.netlify/functions/drills-policy"
    status = 200

[[redirects]]
    from = "/api/market/feed"
    to = "/.netlify/functions/market-feed"
    status = 200

[[redirects]]
    from = "/api/admin"
    to = "/.netlify/functions/drills-admin"
    status = 200

# Interactive API reference and its OpenAPI spec.
[[redirects]]
    from = "/api/docs"
    to = "/.netlify/functions/api-docs"
    status = 200

[[redirects]]
    from = "/api/openapi.json"
    to = "/.netlify/functions/openapi"
    status = 200

# Catch-all for unknown /api/* paths. MUST stay below every real /api/ entry
# above (first match wins) and above the SPA fallback (`/* -> /index.html`)
# below. Without it, an unknown /api/ path serves the app shell with HTTP 200;
# the function returns a JSON 404 instead. The rewrite status is 200 so the
# function's own 404 status flows through to the client.
[[redirects]]
    from = "/api/*"
    to = "/.netlify/functions/api-not-found"
    status = 200

[[redirects]]
    from = "/i/*"
    to = "/.netlify/functions/drills-preview?slug=:splat"
    status = 200

[[redirects]]
    from = "/brief/plan/*"
    to = "https://web.ringdrill.app/brief/plan/:splat"
    status = 302

[[redirects]]
    from = "/brief/*"
    to = "https://web.ringdrill.app/brief/:splat"
    status = 302

[[redirects]]
    from = "/d/*"
    to = "/.netlify/functions/deep-link/:splat"
    status = 200

# Serve .well-known files as-is (before the SPA catch-all)
[[redirects]]
    from = "/.well-known/*"
    to = "/.well-known/:splat"
    status = 200

# Optional but recommended: ensure correct headers
[[headers]]
    for = "/.well-known/assetlinks.json"
    [headers.values]
        Content-Type = "application/json; charset=utf-8"
        Cache-Control = "public, max-age=3600"

# Apple Universal Links: the AASA file has no extension and MUST be JSON (ADR-0021)
[[headers]]
    for = "/.well-known/apple-app-site-association"
    [headers.values]
        Content-Type = "application/json"
        Cache-Control = "public, max-age=3600"

# Single Page App routing: deep links -> index.html
[[redirects]]
    from = "/*"
    to = "/index.html"
    status = 200